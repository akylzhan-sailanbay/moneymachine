<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manifest Studio</title>
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111112'/%3E%3Cpath d='M8 22V10l8 8 8-8v12' fill='none' stroke='%23e8c46b' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts used inside the cards (embedded into exported images) -->
  <link data-embed-fonts rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Outfit:wght@600&family=Inter:wght@400;500;600;700&display=swap">
  <!-- Fonts for the studio interface -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&display=swap">
  <link rel="stylesheet" href="src/css/app.css">
  <link rel="stylesheet" href="src/css/calendar.css">
  <link rel="stylesheet" href="src/css/pnl.css">
  <link rel="stylesheet" href="src/css/trade.css">
</head>
<body class="mode-edit">
  <header class="topbar">
    <div class="brand">Manifest</div>
    <nav class="tabs" role="tablist" aria-label="Templates"></nav>
    <div class="actions">
      <div class="mode" role="radiogroup" aria-label="Mode">
        <button type="button" role="radio" data-mode="edit">Edit</button>
        <button type="button" role="radio" data-mode="preview">Preview</button>
      </div>
      <button type="button" class="btn btn-primary" id="save">Save image</button>
    </div>
  </header>

  <main class="workspace">
    <section class="stage" id="stage" aria-label="Canvas"></section>
    <aside class="inspector" id="inspector" aria-label="Settings"></aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <script src="src/js/util.js"></script>
  <script src="src/js/store.js"></script>
  <script src="src/js/app.js"></script>
  <script src="src/js/inline.js"></script>
  <script src="src/js/form.js"></script>
  <script src="src/js/exporter.js"></script>
  <script src="src/js/calendar.js"></script>
  <script src="src/js/pnl.js"></script>
  <script src="src/js/trade.js"></script>
</body>
</html>
